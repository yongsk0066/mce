[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/yongsk0066/mce"
homepage = "https://yongsk0066.github.io/mce/"
keywords = ["nlp", "finnish", "morphology", "wasm", "spell-check"]
categories = ["text-processing", "wasm"]

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
hashbrown = "0.16"
wasm-bindgen = "0.2"

# Internal crates
mce-core = { path = "crates/mce-core" }
mce-fst = { path = "crates/mce-fst" }
mce-tokenizer = { path = "crates/mce-tokenizer" }
mce-speller = { path = "crates/mce-speller" }
mce-disambig = { path = "crates/mce-disambig" }
mce-comonad = { path = "crates/mce-comonad" }
mce-fi = { path = "crates/mce-fi" }
mce-grammar = { path = "crates/mce-grammar" }
mce-eval = { path = "crates/mce-eval" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
