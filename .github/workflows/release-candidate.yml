name: Release Candidate

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Rust CI (fmt + clippy + test + audit)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: WASM build + size check
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/check-wasm-size
        id: wasm
      # Upload WASM pkg as artifact for integration tests
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/mce-wasm/pkg/
          retention-days: 1

  # Job 3: JS integration tests (vitest via bun)
  integration-js:
    needs: [wasm-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Download freshly built WASM
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/mce-wasm/pkg/
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: tests/integration-js
        run: bun install
      - name: Run integration tests
        working-directory: tests/integration-js
        run: npx vitest run
