name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg crates/mce-wasm

      - name: Patch package.json (name + version from tag)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd crates/mce-wasm/pkg
          node -e "
            import { readFileSync, writeFileSync } from 'fs';
            const p = JSON.parse(readFileSync('./package.json', 'utf8'));
            p.name = '@yongsk0066/mce';
            p.version = '$VERSION';
            p.description = 'Finnish NLP engine — morphological analysis, spell checking, POS tagging, hyphenation, grammar checking. Browser-first, offline-capable, ~395KB WASM.';
            p.repository = { type: 'git', url: 'https://github.com/yongsk0066/mce.git' };
            p.homepage = 'https://github.com/yongsk0066/mce#readme';
            p.keywords = ['finnish', 'nlp', 'morphology', 'spell-check', 'wasm', 'pos-tagging', 'hyphenation', 'grammar-check', 'webassembly', 'offline'];
            writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " --input-type=module

      - name: Publish to npm
        working-directory: crates/mce-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            crates/mce-wasm/pkg/mce_wasm_bg.wasm
            crates/mce-wasm/pkg/mce_wasm.js
            crates/mce-wasm/pkg/mce_wasm.d.ts
