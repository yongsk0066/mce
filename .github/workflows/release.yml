name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: CI checks
        run: |
          cargo fmt --all --check
          cargo clippy --all-features -- -D warnings
          cargo test --all-features

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg crates/mce-wasm

      - name: Patch package.json (name + version from tag)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd crates/mce-wasm/pkg
          node -e "
            import { readFileSync, writeFileSync } from 'fs';
            const p = JSON.parse(readFileSync('./package.json', 'utf8'));
            p.name = '@yongsk0066/mce';
            p.version = '$VERSION';
            p.repository = { type: 'git', url: 'https://github.com/yongsk0066/mce.git' };
            p.homepage = 'https://github.com/yongsk0066/mce#readme';
            writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " --input-type=module

      - name: Publish to npm
        run: |
          cd crates/mce-wasm/pkg
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            crates/mce-wasm/pkg/mce_wasm_bg.wasm
            crates/mce-wasm/pkg/mce_wasm.js
            crates/mce-wasm/pkg/mce_wasm.d.ts

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build fresh WASM for docs
        run: wasm-pack build --target web --out-dir pkg crates/mce-wasm
      - name: Copy latest assets to docs
        run: |
          cp crates/mce-wasm/pkg/mce_wasm_bg.wasm docs/
          cp crates/mce-wasm/pkg/mce_wasm.js docs/
          cp data/wordlist.txt docs/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4
