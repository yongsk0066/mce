name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: CI checks
        run: |
          cargo fmt --all --check
          cargo clippy --all-features -- -D warnings
          cargo test --all-features

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg crates/mce-wasm

      - name: Patch package.json (name + version from tag)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd crates/mce-wasm/pkg
          node -e "
            import { readFileSync, writeFileSync } from 'fs';
            const p = JSON.parse(readFileSync('./package.json', 'utf8'));
            p.name = '@yongsk0066/mce';
            p.version = '$VERSION';
            p.description = 'Finnish NLP engine — morphological analysis, spell checking, POS tagging, hyphenation, grammar checking. Browser-first, offline-capable, 365KB WASM.';
            p.repository = { type: 'git', url: 'https://github.com/yongsk0066/mce.git' };
            p.homepage = 'https://github.com/yongsk0066/mce#readme';
            p.keywords = ['finnish', 'nlp', 'morphology', 'spell-check', 'wasm', 'pos-tagging', 'hyphenation', 'grammar-check', 'webassembly', 'offline'];
            writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " --input-type=module

      - name: Publish to npm
        run: |
          cd crates/mce-wasm/pkg
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            crates/mce-wasm/pkg/mce_wasm_bg.wasm
            crates/mce-wasm/pkg/mce_wasm.js
            crates/mce-wasm/pkg/mce_wasm.d.ts

  # Docs are deployed by docs.yml on main push (GitHub Pages Actions mode).
  # No separate deploy-docs job needed here.
