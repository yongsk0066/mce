name: 'MCE Trie Benchmark'
description: 'Run criterion benchmarks for M1 Succinct Trie'

outputs:
  results:
    description: 'Benchmark results text'
    value: ${{ steps.bench.outputs.results }}

runs:
  using: 'composite'
  steps:
    - name: Run trie benchmarks
      id: bench
      shell: bash
      run: |
        cargo bench -p mce-core --bench trie_bench -- --output-format bencher 2>&1 | tee bench_raw.txt

        # Extract key results for the summary
        RESULTS=$(grep "^test " bench_raw.txt || echo "No benchmark results found")

        echo "results<<BENCH_EOF" >> "$GITHUB_OUTPUT"
        echo "$RESULTS" >> "$GITHUB_OUTPUT"
        echo "BENCH_EOF" >> "$GITHUB_OUTPUT"
