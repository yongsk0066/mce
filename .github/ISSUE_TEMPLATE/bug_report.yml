name: Bug Report
description: Report a bug or incorrect behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Load dictionary with `MceEngine.load(...)`
        2. Call `engine.analyze("...")`
        3. Observe incorrect output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - WASM (browser)
        - WASM (Node.js)
        - Native (mce-cli)
        - Rust library
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MCE version
      placeholder: "0.1.0"
    validations:
      required: false
