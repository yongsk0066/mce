name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      options:
        - Morphological analysis
        - Spell checking / suggestions
        - POS tagging / disambiguation
        - Grammar checking
        - Hyphenation
        - Generation
        - WASM / npm package
        - CLI
        - Documentation
        - Other
    validations:
      required: true
