[package]
name = "mce-wasm"
version = "0.3.2"
description = "WASM bindings for MCE"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mce-core.workspace = true
mce-fst.workspace = true
mce-fi.workspace = true
mce-speller.workspace = true
mce-disambig.workspace = true
mce-comonad.workspace = true
mce-tokenizer.workspace = true
mce-grammar.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-opt disabled: while raw binary shrinks ~10% (365->327KB),
# gzip-compressed size increases ~3% (140->145KB) because wasm-opt's
# code transforms reduce redundancy that gzip exploits.
# Additionally, wasm-pack doesn't pass --enable-bulk-memory to wasm-opt,
# causing feature mismatch with Rust 1.93+ output.
# Re-enable if wasm-pack adds feature flag passthrough.
wasm-opt = false
