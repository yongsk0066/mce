[package]
name = "mce-wasm"
version = "0.3.0"
description = "WASM bindings for MCE"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mce-core.workspace = true
mce-fst.workspace = true
mce-fi.workspace = true
mce-speller.workspace = true
mce-disambig.workspace = true
mce-comonad.workspace = true
mce-tokenizer.workspace = true
mce-grammar.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-opt disabled: system wasm-opt (binaryen 126) doesn't support
# bulk-memory/nontrapping-fptoint features emitted by Rust 1.93+.
# Re-enable after upgrading binaryen to v119+ with feature support,
# or install wasm-pack 0.14+ which bundles a compatible wasm-opt.
wasm-opt = false
